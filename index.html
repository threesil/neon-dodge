<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Dodge</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #05010f;
    overflow: hidden;
    font-family: "Courier New", monospace;
  }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  const COLORS = ["#ff2bd6", "#00f0ff", "#faff00", "#39ff14", "#ff6a00", "#b026ff"];
  const SHIP_COLOR = "#00f0ff";

  let W = 0, H = 0;
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    if (ship) ship.y = H - 70;
  }

  // ---- State ----
  let state = "start"; // "start" | "playing" | "over"
  let ship = null;
  let asteroids = [];
  let particles = [];
  let stars = [];
  let score = 0;
  let elapsed = 0;
  let spawnTimer = 0;
  let best = 0;
  try { best = Number(localStorage.getItem("neonDodgeBest")) || 0; } catch (e) {}

  const keys = {};

  function makeStars() {
    stars = [];
    const count = Math.floor((W * H) / 6000);
    for (let i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.5 + 0.3,
        s: Math.random() * 40 + 20,
      });
    }
  }

  function reset() {
    ship = { x: W / 2, y: H - 70, w: 30, h: 36, speed: 480 };
    asteroids = [];
    particles = [];
    score = 0;
    elapsed = 0;
    spawnTimer = 0;
  }

  // Difficulty ramps with time survived.
  // Gentle warm-up: starts at 0.5x and eases up to 1x over the first 12 seconds,
  // then gains +1x every 15 seconds after that.
  const WARMUP = 12;
  function difficulty() {
    if (elapsed < WARMUP) return 0.5 + 0.5 * (elapsed / WARMUP);
    return 1 + (elapsed - WARMUP) / 15;
  }

  // ---- Sound ----
  // Created on first key press, since browsers block audio until the user interacts.
  let audio = null;
  function initAudio() {
    if (audio) return;
    try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }

  function playExplosion() {
    if (!audio) return;
    const now = audio.currentTime;
    const duration = 0.6;

    // White noise, filtered from bright to dull for a short "boom"
    const buffer = audio.createBuffer(1, Math.floor(audio.sampleRate * duration), audio.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    const noise = audio.createBufferSource();
    noise.buffer = buffer;

    const filter = audio.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.setValueAtTime(2000, now);
    filter.frequency.exponentialRampToValueAtTime(100, now + duration);

    const gain = audio.createGain();
    gain.gain.setValueAtTime(0.5, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

    noise.connect(filter).connect(gain).connect(audio.destination);
    noise.start(now);
    noise.stop(now + duration);

    // Low thump underneath
    const osc = audio.createOscillator();
    const oscGain = audio.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(140, now);
    osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
    oscGain.gain.setValueAtTime(0.4, now);
    oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
    osc.connect(oscGain).connect(audio.destination);
    osc.start(now);
    osc.stop(now + 0.3);
  }

  function spawnAsteroid() {
    const d = difficulty();
    const r = 14 + Math.random() * 26;
    const points = [];
    const n = 7 + Math.floor(Math.random() * 5);
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      points.push({ a, m: 0.7 + Math.random() * 0.35 });
    }
    asteroids.push({
      x: r + Math.random() * (W - r * 2),
      y: -r - 10,
      r,
      vy: (140 + Math.random() * 120) * d,
      vx: (Math.random() - 0.5) * 60,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 2.5,
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
      points,
    });
  }

  function explode(x, y) {
    for (let i = 0; i < 60; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 80 + Math.random() * 380;
      particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 0.6 + Math.random() * 0.8,
        max: 1.4,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
      });
    }
  }

  function gameOver() {
    state = "over";
    explode(ship.x, ship.y);
    playExplosion();
    const final = Math.floor(score);
    if (final > best) {
      best = final;
      try { localStorage.setItem("neonDodgeBest", String(best)); } catch (e) {}
    }
  }

  // ---- Update ----
  function update(dt) {
    for (const s of stars) {
      s.y += s.s * dt * (state === "playing" ? difficulty() : 1);
      if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
    }

    for (const p of particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.98;
      p.vy *= 0.98;
      p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);

    if (state !== "playing") return;

    elapsed += dt;
    score += dt * 10 * difficulty();

    // Ship movement
    let dx = 0, dy = 0;
    if (keys.ArrowLeft) dx -= 1;
    if (keys.ArrowRight) dx += 1;
    if (keys.ArrowUp) dy -= 1;
    if (keys.ArrowDown) dy += 1;
    ship.x += dx * ship.speed * dt;
    ship.y += dy * ship.speed * 0.6 * dt;
    ship.x = Math.max(ship.w / 2, Math.min(W - ship.w / 2, ship.x));
    ship.y = Math.max(H * 0.6, Math.min(H - ship.h / 2 - 10, ship.y));
    ship.tilt = dx;

    // Engine trail
    particles.push({
      x: ship.x + (Math.random() - 0.5) * 8,
      y: ship.y + ship.h / 2,
      vx: (Math.random() - 0.5) * 30,
      vy: 120 + Math.random() * 80,
      life: 0.3,
      max: 0.3,
      color: Math.random() < 0.5 ? "#ff2bd6" : "#faff00",
    });

    // Spawning
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnAsteroid();
      spawnTimer = Math.max(0.12, 0.7 / difficulty()) * (0.6 + Math.random() * 0.8);
    }

    // Asteroids
    for (const a of asteroids) {
      a.y += a.vy * dt;
      a.x += a.vx * dt;
      a.rot += a.vr * dt;
    }
    asteroids = asteroids.filter(a => a.y - a.r < H + 20);

    // Collision: circle vs ship's hit circle (slightly forgiving)
    const hitR = ship.w * 0.38;
    for (const a of asteroids) {
      const ddx = a.x - ship.x;
      const ddy = a.y - (ship.y + 4);
      const rr = a.r * 0.8 + hitR;
      if (ddx * ddx + ddy * ddy < rr * rr) {
        gameOver();
        break;
      }
    }
  }

  // ---- Draw ----
  function glow(color, blur) {
    ctx.shadowColor = color;
    ctx.shadowBlur = blur;
  }

  function drawShip() {
    const { x, y, w, h } = ship;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate((ship.tilt || 0) * 0.15);
    glow(SHIP_COLOR, 20);
    ctx.strokeStyle = SHIP_COLOR;
    ctx.lineWidth = 2.5;
    ctx.fillStyle = "rgba(0, 240, 255, 0.12)";
    ctx.beginPath();
    ctx.moveTo(0, -h / 2);
    ctx.lineTo(w / 2, h / 2);
    ctx.lineTo(0, h / 4);
    ctx.lineTo(-w / 2, h / 2);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // cockpit
    glow("#ff2bd6", 12);
    ctx.fillStyle = "#ff2bd6";
    ctx.beginPath();
    ctx.arc(0, -2, 3.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawAsteroid(a) {
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(a.rot);
    glow(a.color, 18);
    ctx.strokeStyle = a.color;
    ctx.lineWidth = 2;
    ctx.fillStyle = "rgba(10, 0, 30, 0.7)";
    ctx.beginPath();
    a.points.forEach((p, i) => {
      const px = Math.cos(p.a) * a.r * p.m;
      const py = Math.sin(p.a) * a.r * p.m;
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    });
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  function text(str, x, y, size, color, align = "center") {
    ctx.font = `bold ${size}px "Courier New", monospace`;
    ctx.textAlign = align;
    ctx.textBaseline = "middle";
    glow(color, 16);
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
  }

  function drawGrid() {
    // Synthwave-style floor grid near the bottom
    ctx.save();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "rgba(176, 38, 255, 0.15)";
    ctx.lineWidth = 1;
    const top = H * 0.65;
    const offset = (elapsed * 60 * (state === "playing" ? difficulty() : 1)) % 40;
    for (let y = top + offset; y < H; y += 40) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    for (let i = -10; i <= 10; i++) {
      ctx.beginPath();
      ctx.moveTo(W / 2 + i * 40, top);
      ctx.lineTo(W / 2 + i * 160, H);
      ctx.stroke();
    }
    ctx.restore();
  }

  function draw() {
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#05010f";
    ctx.fillRect(0, 0, W, H);

    // Stars
    ctx.fillStyle = "#ffffff";
    for (const s of stars) {
      ctx.globalAlpha = 0.3 + s.r / 2;
      ctx.fillRect(s.x, s.y, s.r, s.r * (state === "playing" ? 1 + difficulty() : 1));
    }
    ctx.globalAlpha = 1;

    drawGrid();

    for (const a of asteroids) drawAsteroid(a);

    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      glow(p.color, 10);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
    }
    ctx.globalAlpha = 1;

    if (state === "playing") drawShip();

    // HUD
    if (state !== "start") {
      text(`SCORE ${Math.floor(score)}`, W / 2, 34, 28, "#faff00");
      text(`BEST ${best}`, W - 20, 34, 16, "#ff2bd6", "right");
      text(`SPEED x${difficulty().toFixed(1)}`, 20, 34, 16, "#39ff14", "left");
    }

    if (state === "start") {
      text("NEON DODGE", W / 2, H / 2 - 60, Math.min(80, W / 9), "#ff2bd6");
      text("Arrow keys to move. Dodge the asteroids.", W / 2, H / 2 + 10, 18, "#00f0ff");
      if (Math.floor(performance.now() / 500) % 2 === 0) {
        text("Press SPACE or ENTER to start", W / 2, H / 2 + 60, 22, "#faff00");
      }
      if (best > 0) text(`BEST ${best}`, W / 2, H / 2 + 110, 16, "#39ff14");
    } else if (state === "over") {
      text("GAME OVER", W / 2, H / 2 - 40, Math.min(72, W / 10), "#ff2bd6");
      text(`Score: ${Math.floor(score)}`, W / 2, H / 2 + 20, 24, "#00f0ff");
      if (Math.floor(performance.now() / 500) % 2 === 0) {
        text("Press SPACE or ENTER to play again", W / 2, H / 2 + 70, 20, "#faff00");
      }
    }
    ctx.shadowBlur = 0;
  }

  // ---- Input ----
  window.addEventListener("keydown", e => {
    if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " "].includes(e.key)) e.preventDefault();
    keys[e.key] = true;
    initAudio();
    if (audio && audio.state === "suspended") audio.resume();
    if ((e.key === " " || e.key === "Enter") && state !== "playing") {
      reset();
      state = "playing";
    }
  });
  window.addEventListener("keyup", e => { keys[e.key] = false; });
  window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; });

  // ---- Loop ----
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); // clamp to avoid big jumps after tab switch
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  window.addEventListener("resize", () => { resize(); makeStars(); });
  resize();
  makeStars();
  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
